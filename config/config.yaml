# ============================================================
# CONSTITUTIONAL RAG Q&A SYSTEM — MASTER CONFIGURATION
# ============================================================
# Project: E2 · RAG Engine over Real Document Corpus
# Domain: History & Politics (Q3)
# Countries: United States, France, Germany, Pakistan, Norway, Canada
# Version: 2.0.0
# ============================================================

# ──────────────────────────────────────
# DOCUMENT INGESTION
# ──────────────────────────────────────
ingestion:
  # Supported file formats for source documents
  supported_formats:
    - ".pdf"
    - ".txt"
    - ".md"
  
  # Chunking parameters
  chunk_size: 500              # Characters per chunk
  chunk_overlap: 50            # Overlap between consecutive chunks
  min_chunk_length: 100        # Discard chunks shorter than this (prevents noise)
  
  # Source documents directory
  data_directory: "data/documents"
  
  # Processed artifacts directory
  processed_directory: "data/processed"

# ──────────────────────────────────────
# EMBEDDING MODEL
# ──────────────────────────────────────
embedding:
  # all-MiniLM-L6-v2: 384 dimensions, 80MB, CPU-friendly, 1B+ training pairs
  model_name: "all-MiniLM-L6-v2"
  
  # Batch size for encoding (adjust based on RAM)
  batch_size: 32
  
  # Compute device: "cpu" or "cuda"
  device: "cpu"
  
  # Normalize embeddings for cosine similarity
  normalize_embeddings: true

# ──────────────────────────────────────
# VECTOR STORE (ChromaDB)
# ──────────────────────────────────────
vector_store:
  type: "chroma"
  persist_directory: "./chroma_db"
  collection_name: "constitutional_documents"
  
  # Distance metric for similarity search
  distance_metric: "cosine"
  
  # HNSW index parameters (ChromaDB defaults are fine)
  hnsw_M: 16
  hnsw_ef_construction: 100
  hnsw_ef_search: 10

# ──────────────────────────────────────
# RETRIEVAL
# ──────────────────────────────────────
retrieval:
  # Number of chunks to retrieve per query
  top_k: 3
  
  # Minimum similarity score (0-1) to consider a chunk relevant
  # Below this threshold = "I don't have enough information"
  similarity_threshold: 0.5
  
  # Warning threshold for debugging
  min_similarity_warning: 0.3

# ──────────────────────────────────────
# LLM GENERATION
# ──────────────────────────────────────
llm:
  # Provider: "ollama" (local), "openai", "groq", or "custom"
  provider: "ollama"
  
  # Model name (depends on provider)
  # Ollama: llama3.1, llama3, mistral, phi3
  # OpenAI: gpt-3.5-turbo, gpt-4
  # Groq: llama3-70b-8192, mixtral-8x7b-32768
  model: "llama3.1"
  
  # API base URL (for Ollama and custom providers)
  api_base: "http://localhost:11434/v1"
  
  # Low temperature for factual, deterministic answers
  temperature: 0.1
  
  # Maximum tokens in generated answer
  max_tokens: 500
  
  # System prompt — enforces citation and grounding
  system_prompt: |
    You are a constitutional law expert assistant. 
    Answer questions using ONLY the information provided in the context.
    
    RULES:
    1. Use ONLY the provided context — no outside knowledge
    2. Cite EVERY fact using this format: [Source: filename, Page: X]
    3. If the context doesn't contain enough information, say exactly: 
       "I don't have enough information in the provided documents to answer this question."
    4. Be concise, factual, and well-organized
    5. Do not speculate or add information not in the context
